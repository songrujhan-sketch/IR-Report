<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="介入放射科單頁點選英文報告工具"><title>IR Report</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="top"><div class="brand"><strong><span>IR</span> Report</strong><small>STRUCTURED REPORTING</small></div><nav id="tabs" aria-label="處置主頁籤"></nav><a class="download" href="ir-options.xlsx" download="IR_Report_常用選項與片語.xlsx">選項 Excel ↓</a><button id="library">片語庫</button><span class="private">● PRIVATE</span></div><div class="clinical"><div><span>Clinical information</span><div class="choices" id="clinicalChoices"></div></div><details class="supplement"><summary>補充</summary><input id="indication" aria-label="補充臨床資訊" placeholder="選填英文適應症；請勿輸入姓名、病歷號" autocomplete="off"></details><span>僅於此頁處理 · 不保存個案</span></div></header>
<main><section class="editor"><div class="modulebar"><div><span class="eyebrow">PROCEDURE</span><h1 id="moduleTitle"></h1></div><div class="subtypes" id="subtypes"></div></div><div id="form"></div></section><div id="splitter" role="separator" aria-label="調整預覽寬度" aria-orientation="vertical" tabindex="0"></div><aside><div class="previewhead"><div><b>REPORT</b><span>即時預覽</span></div><div class="report-size"><button id="reportSmaller" type="button" aria-label="縮小報告文字">A−</button><output id="reportSize">14 px</output><button id="reportLarger" type="button" aria-label="放大報告文字">A＋</button></div><small id="count"></small></div><div class="width"><label for="width">預覽寬度</label><input id="width" type="range" min="22" max="50" value="30"><span id="widthValue">30%</span></div><pre id="report" tabindex="0" aria-label="英文報告預覽"></pre><div class="actions"><button class="primary" id="copy">產生並複製<small>Alt + P</small></button><button class="next" id="next">↻ 下一位<small>Alt + Enter</small></button></div><div id="checks" class="checks" aria-live="polite"></div><p class="footnote">Alt + 1–5 切換處置 · Alt + Z 復原<br>下一位僅暫存於記憶體，可於 30 秒內復原；重新整理即清除。</p></aside></main>
<dialog id="workDialog"><h2 id="workTitle"></h2><div id="workBody"></div><div class="dialogactions"><button data-work-close>完成／關閉</button></div></dialog><div id="toast" role="status"></div><dialog id="switchDialog"><h2>切換處置</h2><p>切換將清除目前處置與不相容欄位，一併清除 Clinical info。請先複製需要的報告。</p><div class="dialogactions"><button id="cancelSwitch">取消</button><button class="primary" id="confirmSwitch">清除並切換</button></div></dialog>
<dialog id="libraryDialog"><h2>搜尋片語庫</h2><p>個案欄位與下列靜態句型分開管理；個案不寫入儲存空間。</p><div id="libraryContent"></div><p class="notice">片語經整理供本次選取；請依實際處置確認內容後使用。</p><button id="closeLibrary">關閉</button></dialog><script src="engine.js"></script><script src="picks.js"></script><script src="profiles.js"></script><script src="controls.js"></script><script src="compact.js"></script><script src="app.js"></script></body></html>
